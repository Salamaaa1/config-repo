server:
  port: 9090

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: department-service
          uri: lb://department-service
          predicates:
            - Path=/api/departments/**
          filters:
            - StripPrefix=0

        - id: teacher-service
          uri: lb://teacher-service
          predicates:
            - Path=/api/teachers/**
          filters:
            - StripPrefix=0

        - id: campus-department-route
          uri: lb://department-service
          predicates:
            - Path=/campus/api/departments/**
          filters:
            - StripPrefix=1
            - AddResponseHeader=X-Gateway, gateway-service

        - id: campus-teacher-route
          uri: lb://teacher-service
          predicates:
            - Path=/campus/api/teachers/**
          filters:
            - StripPrefix=1
            - AddResponseHeader=X-Gateway, gateway-service

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true
