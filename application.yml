campus:
  organization: EMI
  message: "TP6-v4 testing"

spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: tpbus
    password: tpbus-local
    listener:
      simple:
        missing-queues-fatal: false
  cloud:
    stream:
      bindings:
        springCloudBusInput:
          group: bus-refresh

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,busrefresh,bus-refresh
