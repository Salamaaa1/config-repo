server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:departmentsdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    refresh:
      enable: false
  instance:
    prefer-ip-address: true

campus:
  release: r1
